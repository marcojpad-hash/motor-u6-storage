name: U6 runner smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest
      - name: Compile runner and gate modules
        run: |
          python -m py_compile motor/correr_estandar.py motor/calibracion/arnes_calibracion.py motor/calibracion/gate_z90.py motor/motor/caldero_II_runner_generico.py
      - name: Run runner contract tests
        run: |
          python -m pytest -q motor/tests/test_runner_json_contract.py motor/tests/test_runner_no_mc_output_path.py motor/tests/test_runner_retained_cut_plain_copy.py motor/tests/test_arnes_calibracion.py
      - name: Execute one real case through the runner
        shell: bash
        run: |
          set +e
          cd motor
          python correr_estandar.py ../casos/fabrica/cola/CAL_F001_01_NAPOLEON/entrada.json RUNNER_SMOKE /tmp/RUNNER_SMOKE.json --no-mc
          rc=$?
          set -e
          echo "runner_exit_code=$rc"
          if [[ "$rc" -ne 0 && "$rc" -ne 5 ]]; then
            echo "Runner returned an unexpected code."
            exit "$rc"
          fi
          test -s /tmp/RUNNER_SMOKE.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("/tmp/RUNNER_SMOKE.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert isinstance(d, dict), "runner output must be a JSON object"
          assert d.get("case_id"), "runner output is missing case_id"
          print("RUNNER_SMOKE_OUTPUT_OK")
          print("case_id=", d.get("case_id"))
          print("version=", d.get("version"))
          print("estado_final=", d.get("estado_final"))
          print("estado_ejecucion=", d.get("estado_ejecucion"))
          print("matriz_data_table_sha256=", (d.get("matriz") or {}).get("data_table_sha256"))
          PY
