name: Traza campo 244
on:
  push:
    branches: [main]
    paths:
      - "motor/traza_campo_244_v2.py"
      - "motor/motor/traza_campo_244.py"
      - "tests/test_traza_campo_244_v2.py"
      - ".github/workflows/traza-campo-244.yml"
  pull_request:
    paths:
      - "motor/traza_campo_244_v2.py"
      - "motor/motor/traza_campo_244.py"
      - "tests/test_traza_campo_244_v2.py"
      - ".github/workflows/traza-campo-244.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Ejecutar pruebas de la ruta real del runner
        run: python -B -m unittest discover -s tests -p 'test_traza_campo_244_v2.py' -v
