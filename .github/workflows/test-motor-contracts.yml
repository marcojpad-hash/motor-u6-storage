name: Motor runner contract tests

on:
  push:
    branches: [main, alterno/cameo-pesos]
    paths:
      - "motor/correr_estandar.py"
      - "motor/tests/test_runner_json_contract.py"
      - "motor/SHA256SUMS_MOTOR.txt"
      - "motor/MANIFIESTO_COMPACTO_SHA256.json"
      - "motor/UNIFICACION_SHA256_MANIFEST.json"
      - "motor/scripts/regenerar_manifestos_trabajo.py"
      - "motor/calibracion/gate_z90.py"
      - "motor/tests/test_gate_z90_biografico.py"
      - "motor/PROTOCOLO_BIOGRAFICO_Z90.md"
      - "motor/CONTRATO_ENTRADA_LLM.txt"
      - "motor/motor/MOTOR_V15_3_UNICO_20260927.py"
      - "motor/motor/sidecar_caldero_busqueda_arquetipos.py"
      - "motor/motor/filtro_tokens_arquetipos_v2.py"
      - "motor/capa_llm/filtro_entrada_dirigida_017.py"
      - "motor/tests/test_cableado_017.py"
      - "motor/tests/test_filtro_tokens_arquetipos_v2.py"
      - "tests/test_caldero_corte_temporal.py"
      - "motor/motor/matriz_mortalidad_z90_v0_2.py"
      - "motor/tests/test_matriz_mortalidad_z90_v0_2.py"
      - "motor/MORTALITY_AUDIT/MORTALITY_STATISTICS_SCHEMA_V1.json"
      - "motor/MORTALITY_AUDIT/mortality_statistics_template.csv"
      - "motor/MORTALITY_AUDIT/MORTALITY_STATISTICS_SOURCE_MANIFEST.json"
      - "motor/MORTALITY_AUDIT/mortality_statistics_source_template.csv"
      - "motor/MORTALITY_AUDIT/README.md"
      - "motor/scripts/normalizar_mortalidad_preparacion.py"
      - "motor/tests/test_normalizar_mortalidad_preparacion.py motor/tests/test_import_wpp_life_table.py"
      - "motor/scripts/import_wpp_life_table.py"
      - "motor/tests/test_import_wpp_life_table.py"
      - ".github/workflows/update-mortality-wpp.yml"
      - ".github/workflows/test-motor-contracts.yml"
  pull_request:
    paths:
      - "motor/correr_estandar.py"
      - "motor/tests/test_runner_json_contract.py"
      - "motor/SHA256SUMS_MOTOR.txt"
      - "motor/MANIFIESTO_COMPACTO_SHA256.json"
      - "motor/UNIFICACION_SHA256_MANIFEST.json"
      - "motor/scripts/regenerar_manifestos_trabajo.py"
      - "motor/calibracion/gate_z90.py"
      - "motor/tests/test_gate_z90_biografico.py"
      - "motor/PROTOCOLO_BIOGRAFICO_Z90.md"
      - "motor/CONTRATO_ENTRADA_LLM.txt"
      - "motor/motor/MOTOR_V15_3_UNICO_20260927.py"
      - "motor/motor/sidecar_caldero_busqueda_arquetipos.py"
      - "motor/motor/filtro_tokens_arquetipos_v2.py"
      - "motor/capa_llm/filtro_entrada_dirigida_017.py"
      - "motor/tests/test_cableado_017.py"
      - "motor/tests/test_filtro_tokens_arquetipos_v2.py"
      - "tests/test_caldero_corte_temporal.py"
      - "motor/motor/matriz_mortalidad_z90_v0_2.py"
      - "motor/tests/test_matriz_mortalidad_z90_v0_2.py"
      - "motor/MORTALITY_AUDIT/MORTALITY_STATISTICS_SCHEMA_V1.json"
      - "motor/MORTALITY_AUDIT/mortality_statistics_template.csv"
      - ".github/workflows/test-motor-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        # numpy: test_cableado_017.py importa el runner único (lo exige en runtime).
        run: python -m pip install pytest numpy
      - name: Validate runner and mortality contracts
        run: python -m pytest -q motor/tests/test_runner_json_contract.py motor/tests/test_matriz_mortalidad_z90_v0_2.py motor/tests/test_normalizar_mortalidad_preparacion.py motor/tests/test_cableado_017.py motor/tests/test_filtro_tokens_arquetipos_v2.py tests/test_caldero_corte_temporal.py motor/tests/test_gate_z90_biografico.py
      - name: Regenerate and inspect motor manifests (read-only)
        if: always()
        run: |
          python motor/scripts/regenerar_manifestos_trabajo.py
          grep -E 'calibracion/gate_z90.py|CONTRATO_ENTRADA_LLM.txt|tests/test_gate_z90_biografico.py' motor/SHA256SUMS_MOTOR.txt
          git diff --stat -- motor/SHA256SUMS_MOTOR.txt motor/MANIFIESTO_COMPACTO_SHA256.json motor/UNIFICACION_SHA256_MANIFEST.json
      - name: Upload regenerated motor manifests for verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-u6-manifests-${{ github.run_id }}
          path: |
            motor/SHA256SUMS_MOTOR.txt
            motor/MANIFIESTO_COMPACTO_SHA256.json
            motor/UNIFICACION_SHA256_MANIFEST.json
          retention-days: 1
          if-no-files-found: error
      - name: Record source hashes
        run: sha256sum motor/correr_estandar.py motor/motor/MOTOR_V15_3_UNICO_20260927.py motor/motor/MOTOR_V15_3_NATIVO_V0_9_UNICO.py motor/motor/matriz_mortalidad_z90_v0_2.py motor/motor/sidecar_caldero_busqueda_arquetipos.py motor/motor/filtro_tokens_arquetipos_v2.py motor/capa_llm/filtro_entrada_dirigida_017.py
