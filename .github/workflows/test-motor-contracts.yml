name: Motor runner contract tests

on:
  push:
    branches: [main]
    paths:
      - "motor/correr_estandar.py"
      - "motor/tests/test_runner_json_contract.py"
      - "motor/motor/matriz_mortalidad_z90_v0_2.py"
      - "motor/tests/test_matriz_mortalidad_z90_v0_2.py"
      - "motor/MORTALITY_AUDIT/MORTALITY_STATISTICS_SCHEMA_V1.json"
      - "motor/MORTALITY_AUDIT/mortality_statistics_template.csv"
      - "motor/MORTALITY_AUDIT/MORTALITY_STATISTICS_SOURCE_MANIFEST.json"
      - "motor/MORTALITY_AUDIT/mortality_statistics_source_template.csv"
      - "motor/MORTALITY_AUDIT/README.md"
      - "motor/scripts/normalizar_mortalidad_preparacion.py"
      - "motor/tests/test_normalizar_mortalidad_preparacion.py motor/tests/test_import_wpp_life_table.py"
      - "motor/scripts/import_wpp_life_table.py"
      - "motor/tests/test_import_wpp_life_table.py"
      - ".github/workflows/update-mortality-wpp.yml"
      - ".github/workflows/test-motor-contracts.yml"
  pull_request:
    paths:
      - "motor/correr_estandar.py"
      - "motor/tests/test_runner_json_contract.py"
      - "motor/motor/matriz_mortalidad_z90_v0_2.py"
      - "motor/tests/test_matriz_mortalidad_z90_v0_2.py"
      - "motor/MORTALITY_AUDIT/MORTALITY_STATISTICS_SCHEMA_V1.json"
      - "motor/MORTALITY_AUDIT/mortality_statistics_template.csv"
      - ".github/workflows/test-motor-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate runner and mortality contracts
        run: python -m pytest -q motor/tests/test_runner_json_contract.py motor/tests/test_matriz_mortalidad_z90_v0_2.py motor/tests/test_normalizar_mortalidad_preparacion.py
      - name: Record source hashes
        run: sha256sum motor/correr_estandar.py motor/motor/MOTOR_V15_3_UNICO_20260927.py motor/motor/MOTOR_V15_3_NATIVO_V0_9_UNICO.py motor/motor/matriz_mortalidad_z90_v0_2.py
