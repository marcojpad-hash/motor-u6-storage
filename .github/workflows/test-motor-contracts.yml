name: Motor runner contract tests

on:
  push:
    branches: [main]
    paths:
      - "motor/correr_estandar.py"
      - "motor/tests/test_runner_json_contract.py"
      - ".github/workflows/test-motor-contracts.yml"
  pull_request:
    paths:
      - "motor/correr_estandar.py"
      - "motor/tests/test_runner_json_contract.py"
      - ".github/workflows/test-motor-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest
      - name: Validate result/receipt continuity contract
        run: python -m pytest -q motor/tests/test_runner_json_contract.py
