name: Experimento lateral Booleano Motor U6
on:
  push:
    branches:
      - experiment/boolean-sidecar-20261102
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experimento:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Ejecutar prototipo sobre casos sellados F001-F005
        run: python -B experiments/boolean_sidecar_v0_1.py
      - name: Verificar salida y candados
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          p=pathlib.Path("avances/boolean_sidecar/RESULTADOS.json")
          d=json.loads(p.read_text())
          assert d["cases_evaluated"] > 0
          assert d["catalog_families"] == 244
          assert d["status"] == "EXPLORATORY_NOT_PREDICTIVE"
          print("CASOS", d["cases_evaluated"], "COBERTURA", d["truth_coverage_rate_pct"])
          PY
          test "$(sha256sum motor/motor/Engine_V5_CANONICO_SOLO.py | cut -d' ' -f1)" = "665c39a2861e58772522e91272563260d980908b1d4ab9f7092d3413d0c36082"
          test "$(sha256sum motor/motor/patterns_final_v14.json | cut -d' ' -f1)" = "d827dcc3882634ec2d21b3a480d0fee811b28d8fa1b73bab04f0af2c2d6667a1"
