name: Auditoría de corridas Motor U6

on:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows:
      - "Fabrica real - smoke CEB traza 244"
      - "Fabrica lote diario (Grok / dispatch)"
      - "Experimento lateral Booleano Motor U6"
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: motor-u6-auditoria-corridas-main
  cancel-in-progress: true

jobs:
  auditar:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.name != 'Auditoría de corridas Motor U6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Consultar ejecuciones, trabajos y artefactos
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/auditar_corridas_actions.py
      - name: Guardar auditoría cuando haya cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add avances/auditoria_corridas/ULTIMO_ESTADO.json avances/auditoria_corridas/ULTIMO_ESTADO.md
          if git diff --cached --quiet; then
            echo "Auditoría sin cambios"
          else
            git commit -m "audit: snapshot de corridas Actions"
            git push origin HEAD:main
          fi
