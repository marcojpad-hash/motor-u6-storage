name: Motor U7 — ejecutar caso exploratorio aislado

on:
  workflow_dispatch:
    inputs:
      case_file:
        description: "JSON de entrada ya preparado; debe estar en casos/ejecuciones_exploratorias/"
        required: true
        type: string
      case_id:
        description: "Identificador único del caso"
        required: true
        type: string
  push:
    branches:
      - alterno/cameo-pesos
    paths:
      - "casos/ejecuciones_exploratorias/**"

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CALDERO_BUSCADOR: offline
      SEARCH_PROVIDER: offline
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Regenerar y persistir manifiestos del paquete motor
        run: |
          set -euo pipefail
          python -B motor/scripts/regenerar_manifestos_trabajo.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add motor/UNIFICACION_SHA256_MANIFEST.json motor/MANIFIESTO_COMPACTO_SHA256.json motor/SHA256SUMS_MOTOR.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: regenerar manifiestos del paquete Motor U7"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Instalar dependencias del runner
        run: python -m pip install --upgrade numpy scipy ddgs primp lxml click
      - name: Resolver entrada y ejecutar Motor U7
        id: run
        env:
          INPUT_FILE: ${{ inputs.case_file }}
          CASE_ID: ${{ inputs.case_id }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            CHANGED_CASES="$(git diff --name-only "$EVENT_BEFORE" "$GITHUB_SHA" -- casos/ejecuciones_exploratorias/ | grep -E '\.json$' || true)"
            COUNT="$(printf '%s\n' "$CHANGED_CASES" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$COUNT" -ne 1 ]; then
              echo "PUSH_REQUIRES_EXACTLY_ONE_CHANGED_CASE_JSON; found=$COUNT"
              exit 2
            fi
            INPUT_FILE="$CHANGED_CASES"
            CASE_ID="$(basename "$INPUT_FILE" .json)"
          fi
          test -n "$INPUT_FILE"
          case "$INPUT_FILE" in casos/ejecuciones_exploratorias/*.json) ;; *) echo "RUTA_ENTRADA_NO_PERMITIDA"; exit 2;; esac
          test -f "$INPUT_FILE"
          test -n "$CASE_ID"
          mkdir -p /tmp/u7-evidencia
          cp motor/UNIFICACION_SHA256_MANIFEST.json /tmp/u7-evidencia/
          cp motor/MANIFIESTO_COMPACTO_SHA256.json /tmp/u7-evidencia/
          cp motor/SHA256SUMS_MOTOR.txt /tmp/u7-evidencia/
          python -B motor/correr_estandar.py "$INPUT_FILE" "$CASE_ID"
          cp "motor/RESULT_${CASE_ID}.json" /tmp/u7-evidencia/
          cp "motor/RESULT_${CASE_ID}_RECIBO_EJECUCION.json" /tmp/u7-evidencia/
          cp "$INPUT_FILE" /tmp/u7-evidencia/entrada.json
          python - <<'PY'
          import json, pathlib, sys
          d=pathlib.Path("/tmp/u7-evidencia")
          r=json.loads(next(d.glob("*RECIBO_EJECUCION.json")).read_text())
          print(json.dumps({"case_id":r.get("case_id"),"status":r.get("status"),"input_sha256":r.get("input_sha256"),"output_sha256":r.get("output_sha256"),"canonical_engine_sha256":r.get("canonical_engine_sha256"),"patterns_sha256":r.get("patterns_sha256"),"duration_seconds":r.get("duration_seconds")},ensure_ascii=False,indent=2))
          if r.get("status") not in ("COMPLETED","COMPLETED_WITH_METADATA_GAP"):
              sys.exit(3)
          PY
      - name: Publicar recibo y salida como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-u7-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/u7-evidencia/
          if-no-files-found: warn
          retention-days: 30
