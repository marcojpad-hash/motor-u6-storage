name: Fabrica lote diario (Grok / dispatch)
on:
  workflow_dispatch:
    inputs:
      lote:
        description: "ID de lote, ej. F007"
        required: true
        type: string
      semillas:
        description: "Path relativo al archivo de semillas (tras preparar-z ya en repo)"
        required: true
        default: "casos/fabrica/semillas_lote_F007.py"
        type: string
      destinos:
        description: "Path relativo al archivo de destinos Z"
        required: true
        default: "casos/fabrica/destinos_lote_F007.py"
        type: string
      solo_correr:
        description: "Si true, salta preparar-z y solo corre el lote ya preparado"
        required: false
        default: false
        type: boolean
permissions:
  contents: write
jobs:
  fabrica:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FABRICA_CORRIDAS: /tmp/FABRICA_CORRIDAS
      FABRICA_SYNC: "1"
      FABRICA_MODELO: "Grok_principal"
      CALDERO_BUSQUEDA_VIVA: "1"
      CALDERO_BUSCADOR: "auto"
      FABRICA_CALDERO_REQUERIDO: "1"
      FABRICA_PIEZAS_REQUERIDAS: "1"
    steps:
      - name: Registrar inicio de corrida
        env:
          LOTE: ${{ inputs.lote }}
        run: |
          python - <<'PY'
          import datetime, json, os
          meta = {
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_number": os.environ.get("GITHUB_RUN_NUMBER"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "event_name": os.environ.get("GITHUB_EVENT_NAME"),
              "ref": os.environ.get("GITHUB_REF"),
              "sha": os.environ.get("GITHUB_SHA"),
              "actor": os.environ.get("GITHUB_ACTOR"),
              "lote": os.environ.get("LOTE"),
              "started_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          }
          with open("RUN_METADATA.json", "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias buscador vivo
        run: python -m pip install --upgrade numpy scipy ddgs primp lxml click
      - name: Preparar-z
        if: ${{ inputs.solo_correr != true && inputs.solo_correr != 'true' }}
        run: |
          python -B casos/fabrica/fabrica.py preparar-z "${{ inputs.semillas }}" "${{ inputs.destinos }}"
      - name: Correr lote
        run: |
          python -B casos/fabrica/fabrica.py correr --lote "${{ inputs.lote }}"
      - name: Commit resultados al repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add casos/fabrica/lotes casos/fabrica/calibracion_acumulada.csv casos/fabrica/CALIBRACION_ACUMULADA.md stinkbox avances 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios para commit"
          else
            git commit -m "fabrica: lote ${{ inputs.lote }} (Actions / Grok dispatch)"
            git push origin HEAD:main
          fi
      - name: Registrar cierre de corrida
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          LOTE: ${{ inputs.lote }}
        run: |
          python - <<'PY'
          import datetime, json, os
          path = "RUN_METADATA.json"
          try:
              with open(path, encoding="utf-8") as f:
                  meta = json.load(f)
          except Exception:
              meta = {"metadata_start_missing": True}
          meta["lote"] = os.environ.get("LOTE")
          meta["job_status"] = os.environ.get("JOB_STATUS")
          meta["finished_at_utc"] = datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds")
          with open(path, "w", encoding="utf-8") as f:
              json.dump(meta, f, ensure_ascii=False, indent=2)
          PY
      - name: Artifact evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lote-${{ inputs.lote }}-evidencia
          path: |
            RUN_METADATA.json
            casos/fabrica/lotes/${{ inputs.lote }}_*
            /tmp/FABRICA_CORRIDAS/${{ inputs.lote }}/
          if-no-files-found: warn
          retention-days: 30
